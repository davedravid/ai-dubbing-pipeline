# AI Dubbing Pipeline settings.
# Edit values here instead of changing code. Lines starting with # are comments.

# 'fast' or 'quality'. Presets (below) decide which models are used.
preset: fast

# Language of the original speech, e.g. 'en'. Use null to let Whisper detect it.
source_language: null

# Target language(s) for dubbing (used from Phase 3 onwards).
target_languages: [hi]

# 'auto' uses an NVIDIA GPU if one is found, otherwise the CPU.
device: auto

paths:
  data_dir: data
  # Full path to ffmpeg.exe, or null to find it on the system PATH.
  ffmpeg: null
  # Folder with FFmpeg's DLLs (avcodec-*.dll), needed for speech on Windows.
  # null = find the Gyan.FFmpeg.Shared install automatically.
  ffmpeg_dll_dir: null

asr:
  beam_size: 5
  # Skips long silences/music so Whisper does not invent text there.
  vad_filter: true
  # Per-word timings; useful later for subtitles and speaker labels.
  word_timestamps: true

translation:
  model: facebook/nllb-200-distilled-600M
  # Texts translated together; lower it if the computer runs out of memory.
  batch_size: 8
  # How many alternatives the model weighs (higher = slightly better, slower).
  num_beams: 4
  max_new_tokens: 256

tts:
  # You accepted the Coqui Public Model License (non-commercial use only) on 2026-10-25.
  # Set to false to stop the pipeline from using XTTS.
  accept_coqui_license: true
  model: tts_models/multilingual/multi-dataset/xtts_v2
  # 'clone' = copy the voice and delivery of each original line.
  # 'standard' = use one of XTTS's built-in voices for every line.
  voice_mode: clone
  standard_speaker: Damien Black
  # A line shorter than this cannot be cloned from itself; it borrows the
  # nearest longer line within max_borrow_distance_s (the speaker may differ!).
  min_reference_s: 3.0
  max_borrow_distance_s: 10.0
  # If a line is too long for its slot, it is generated again at most this fast.
  max_speed: 1.3
  # Lower = steadier, higher = more varied delivery.
  temperature: 0.7
  # Fixed seed so the same input gives the same speech.
  seed: 1234
  # Transcribe each dubbed line back with Whisper to check it can be understood.
  verify_with_asr: true
  # If a cloned line still cannot be understood after 3 takes, use the (clear)
  # built-in voice instead and flag it. Understandable beats an exact voice match.
  clarity_fallback: true

presets:
  fast:
    asr_model: medium
  quality:
    asr_model: large-v3
