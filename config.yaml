# AI Dubbing Pipeline settings.
# Edit values here instead of changing code. Lines starting with # are comments.

# 'fast' or 'quality'. Presets (below) decide which models are used.
preset: fast

# Language of the original speech, e.g. 'en'. Use null to let Whisper detect it.
source_language: null

# Target language(s) for dubbing (used from Phase 3 onwards).
target_languages: [hi]

# 'auto' uses an NVIDIA GPU if one is found, otherwise the CPU.
device: auto

paths:
  data_dir: data
  # Full path to ffmpeg.exe, or null to find it on the system PATH.
  ffmpeg: null
  # Folder with FFmpeg's DLLs (avcodec-*.dll), needed for speech on Windows.
  # null = find the Gyan.FFmpeg.Shared install automatically.
  ffmpeg_dll_dir: null

asr:
  beam_size: 5
  # Skips long silences/music so Whisper does not invent text there.
  vad_filter: true
  # Per-word timings; useful later for subtitles and speaker labels.
  word_timestamps: true
  # Separate voices from music first (Demucs) and transcribe the voices alone.
  # Music under dialogue made Whisper miss whole lines.
  from_separated_vocals: true
  # Whisper returns long segments on clean voices; cut them into sentences using word
  # timings: after . ? !, at pauses longer than split_pause_s, and anything over max_segment_s.
  split_long_segments: true
  max_segment_s: 10.0
  split_pause_s: 0.6
  # Listen again to stretches where a voice is audible but nothing was transcribed
  # (Whisper skipped the opening greetings once). Recovered lines are marked "recovered".
  fill_gaps: true
  # Names/terms for every job. Per-video terms go in glossaries/<job_id>.txt (one per line).
  glossary: []

diarization:
  # Find who speaks when (pyannote). Needs the HF_TOKEN setting and the model's terms
  # accepted on Hugging Face. pyannote's usage statistics are switched off.
  enabled: true
  # 'voice_fingerprints' (default): one voice fingerprint per transcript line, then grouping.
  #   Handles fast back-and-forth dialogue; on the Avengers clip pyannote's own grouping
  #   merged three people (one of them the only woman) into one speaker.
  # 'pyannote': pyannote's full speaker-diarization pipeline (fine for slow dialogue).
  method: voice_fingerprints
  # How different two voices must be to count as different people (0-2; lower = more people).
  cluster_threshold: 0.7
  model: pyannote/speaker-diarization-3.1
  # Leave null to let pyannote decide how many people speak.
  min_speakers: null
  max_speakers: null
  # Below this share of a line's speech time, its speaker is marked "uncertain".
  min_confidence: 0.7

script:
  # Mark places where two people talk at once (uses pyannote's speaker turns, ~3 min on CPU).
  detect_overlaps: true

translation:
  # Which translator writes the Hindi: 'indictrans2' (AI4Bharat, MIT licence, more natural
  # Hindi; chosen 2026-10-26 after a side-by-side test) or 'nllb'. NLLB is always used to
  # translate options back to English, to check their meaning.
  engine: indictrans2
  indictrans_model: ai4bharat/indictrans2-en-indic-dist-200M
  # 'tum' = familiar (friends, arguments) or 'aap' = respectful (formal scenes).
  register: tum
  model: facebook/nllb-200-distilled-600M
  # Texts translated together; lower it if the computer runs out of memory.
  batch_size: 8
  # How many alternatives the model weighs (higher = slightly better, slower).
  num_beams: 4
  max_new_tokens: 256
  # Extra wordings per sentence to choose from when the main one is too long to speak in
  # time. Each is translated back to check it keeps the meaning. 0 = off.
  alternatives: 5

tts:
  # You accepted the Coqui Public Model License (non-commercial use only) on 2026-10-25.
  # Set to false to stop the pipeline from using XTTS.
  accept_coqui_license: true
  model: tts_models/multilingual/multi-dataset/xtts_v2
  # 'clone' = copy the voice and delivery of each original line.
  # 'standard' = use one of XTTS's built-in voices for every line.
  voice_mode: clone
  # Built-in voices for speakers with no clean sample to clone, by gender.
  standard_speaker: Damien Black
  standard_speaker_female: Ana Florence
  # A line shorter than this cannot be cloned from itself; it borrows the
  # nearest longer line within max_borrow_distance_s (the speaker may differ!).
  min_reference_s: 3.0
  max_borrow_distance_s: 10.0
  # If a line is too long for its slot, it is generated again at most this fast.
  max_speed: 1.3
  # Lower = steadier, higher = more varied delivery.
  temperature: 0.7
  # Fixed seed so the same input gives the same speech.
  seed: 1234
  # Transcribe each dubbed line back with Whisper to check it can be understood.
  verify_with_asr: true
  # If a cloned line still cannot be understood after 3 takes, use the (clear)
  # built-in voice instead and flag it. Understandable beats an exact voice match.
  clarity_fallback: true

mix:
  # Demucs model that separates voices from music/effects (htdemucs = Meta's default).
  demucs_model: htdemucs
  # Listen to the separated background with Whisper to find dialogue that leaked through.
  leak_check: true
  # Each line starts when the actor's voice really begins. Fixing lines that are too long:
  #   1) use the pause after the line, 2) start up to this many seconds early
  #   (0 = never start before the actor; viewers noticed early starts)...
  max_early_start_s: 0.0
  # ...always keeping at least this much silence between two lines...
  min_gap_s: 0.08
  #   3) ...then play the line at most this much faster (pitch unchanged).
  #   Anything still too long is flagged "needs_shorter_translation".
  max_tighten: 1.15
  # Set each dubbed line to the loudness of the original line it replaces.
  match_line_loudness: true
  # Largest correction per line. 12 dB was too small: the dub stayed louder than the original.
  max_line_gain_db: 30.0
  # Lower the music/effects this much while someone is speaking, so voices stay clear.
  background_dip_db: 2.0
  # Safety limiter: the loudest point of the final soundtrack (dB below maximum).
  limiter_peak_db: -1.0
  # Keep the original English soundtrack as a second, switchable audio track.
  include_original_audio: true
  # Put Hindi and English subtitles inside the video as switchable tracks.
  embed_subtitles: true
  audio_bitrate: 192k
  # Put the actors' laughs, sighs and breaths back (Whisper checks they are not words).
  keep_nonverbal_sounds: true

presets:
  fast:
    asr_model: medium
  quality:
    asr_model: large-v3
